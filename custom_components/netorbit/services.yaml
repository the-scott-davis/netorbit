    icon: {selector: {icon: {}}}
    hub: {selector: {text: {}}}
    sleepy: {selector: {boolean: {}}}
    config_entry_id: {selector: {config_entry: {integration: netorbit}}}

ignore_device:
  fields:
    mac: {selector: {text: {}}}
    ip: {selector: {text: {}}}
    device: {selector: {text: {}}}
