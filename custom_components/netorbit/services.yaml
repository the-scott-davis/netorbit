        select:
          options: [router, switch, access_point, mesh_node, other]
    parent: {selector: {text: {}}}
    ip: {selector: {text: {}}}
    mac: {selector: {text: {}}}
    device: {selector: {text: {}}}
    config_entry_id: {selector: {config_entry: {integration: netorbit}}}

remove_hub:
