<!doctype html>
<!-- Preview the card with fake data: serve the repo root, then open
     /scripts/preview/index.html?s=full  (or s=mesh, s=flat) -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetOrbit preview</title>
<style>body { margin:0; background:#111318; padding:24px; max-width:960px; }</style>
<script>window.MDI = {};</script>
<script src="scenarios.js"></script>
<script src="ha-stubs.js"></script>
<script src="../../custom_components/netorbit/frontend/netorbit-card.js"></script>
</head>
<body>
<div id="c"></div>
<script type="module">
  // Icons: a local copy (scripts/preview/mdi.js, from the @mdi/js npm package) if present, otherwise the CDN.
  try { Object.assign(window.MDI, await import("/scripts/preview/mdi.js")); }
  catch (e) { try { Object.assign(window.MDI, await import("https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/mdi.js")); } catch (e2) {} }
  const s = new URLSearchParams(location.search).get("s") || "full";
  const card = document.createElement("netorbit-card");
  // ?cfg={"height":"80vh"} adds card options, for the browser tests.
  const extra = new URLSearchParams(location.search).get("cfg");
  card.setConfig(Object.assign({ title: "Home Network" }, extra ? JSON.parse(extra) : {}));
  document.getElementById("c").appendChild(card);
  window.calls = [];
  // ?live=1 applies each action to the fake data, so the map changes the way it would in Home Assistant.
  const live = new URLSearchParams(location.search).get("live") === "1";
  const states = window.NETORBIT_SCENARIOS[s];
  const summaryId = Object.keys(states).find((k) => states[k].attributes.kind === "summary");
  const slug = (x) => String(x).toLowerCase().replace(/[^a-z0-9]+/g, "_");
  const findDev = (ref) => Object.values(states).find((st) => st.attributes.kind === "device" &&
    [st.attributes.mac, st.attributes.ip, st.attributes.label, st.attributes.node_key].some((v) => v && String(v).toLowerCase() === String(ref).toLowerCase()));
  const apply = (svc, data) => {
    const sum = states[summaryId].attributes;
    if (svc === "assign_device") {
      [].concat(data.device).forEach((ref) => { const st = findDev(ref); if (st) Object.assign(st.attributes, { link: "hub:" + data.hub, placement: "manual" }); });
    } else if (svc === "reset_placement") {
      [].concat(data.device).forEach((ref) => { const st = findDev(ref); if (st) Object.assign(st.attributes, { link: "hub:gateway", placement: "none" }); });
    } else if (svc === "confirm_hub") {
      const sug = (sum.suggested_hubs || []).find((x) => x.key === data.device);
      const dev = sug ? null : findDev(data.device);
      const label = (sug && sug.name) || (dev && dev.attributes.label) || "Hub";
      const id = slug(label);
      if (dev) delete states[dev.entity_id];
      states["sensor.netorbit_" + id] = { entity_id: "sensor.netorbit_" + id, state: "online", attributes: {
        netorbit: true, kind: "hub", label, node_key: "hub:" + id, link: "hub:gateway", hub_type: data.type,
        icon: { switch: "mdi:switch", access_point: "mdi:access-point", mesh_node: "mdi:access-point-network" }[data.type] || "mdi:access-point",
        ip: (sug || dev.attributes).ip, mac: (sug || dev.attributes).mac, last_seen: new Date().toISOString(), hub_source: "manual" } };
      sum.suggested_hubs = (sum.suggested_hubs || []).filter((x) => x !== sug);
    } else if (svc === "dismiss_hub") {
      sum.suggested_hubs = (sum.suggested_hubs || []).filter((x) => x.key !== data.device);
    } else if (svc === "update_hub") {
      const st = Object.values(states).find((x) => x.attributes.node_key === "hub:" + data.hub);
      if (st && data.name) st.attributes.label = data.name;
    }
  };
  const hass = { states, entities: {}, user: { is_admin: true },
    callService: async (d, svc, data) => {
      window.calls.push([d, svc, data]);
      if (live) { apply(svc, data); setTimeout(() => { card.hass = Object.assign({}, hass, { states: Object.assign({}, states) }); }, 250); }
    } };
  card.hass = hass;
  // Handles for the browser tests: a fresh hass object with the (possibly edited) fake states, as Home Assistant sends.
  window.card = card;
  window.pushHass = () => { card.hass = Object.assign({}, hass, { states: Object.assign({}, states) }); };
  // ?s=firstscan&finish=<ms>: the first scan runs through its phases for that long, then finishes with the
  // "done" network, the way a new install looks in Home Assistant.
  const finish = Number(new URLSearchParams(location.search).get("finish"));
  if (s === "firstscan" && finish > 0) {
    const sum = states[summaryId].attributes;
    const phases = [["ping", 5], ["arp", 40], ["names", 50], ["snmp", 70], ["layout", 90]];
    const t0 = Date.now();
    const tick = () => {
      const f = Math.min(1, (Date.now() - t0) / finish);
      if (f >= 1) {
        const done = window.NETORBIT_SCENARIOS.done;
        Object.keys(states).forEach((k) => delete states[k]);
        Object.assign(states, done);
        card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
        window.finished = true;
        return;
      }
      const [phase, base] = phases[Math.min(phases.length - 1, Math.floor(f * phases.length))];
      Object.assign(sum, { scan_phase: phase, scan_progress: Math.max(base, Math.round(f * 100)), found: Math.round(33 * (1 - Math.pow(1 - f, 2))) });
      card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
      setTimeout(tick, 250);
    };
    setTimeout(tick, 250);
  }
  window.ready = true;
</script>
</body>
</html>
