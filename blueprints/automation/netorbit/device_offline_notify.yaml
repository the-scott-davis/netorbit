blueprint:
  name: NetOrbit - notify when a device goes offline
  description: >
    Sends a notification when NetOrbit marks a device as not seen for longer than
    your stale window, and optionally when it comes back.
  domain: automation
  source_url: https://github.com/the-scott-davis/netorbit/blob/main/blueprints/automation/netorbit/device_offline_notify.yaml
  input:
    notify_device:
      name: Phone to notify
      description: A device running the Home Assistant companion app.
      selector:
        device:
          integration: mobile_app
    notify_recovered:
      name: Also notify when it comes back
      default: true
      selector:
        boolean:

mode: queued
max: 25

triggers:
  - trigger: event
    event_type: netorbit_device_stale
    id: stale
  - trigger: event
    event_type: netorbit_device_recovered
    id: recovered

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: stale
      - condition: and
        conditions:
          - condition: trigger
            id: recovered
          - condition: template
            value_template: !input notify_recovered

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: >-
      {{ trigger.event.data.name }} {{ 'is offline' if trigger.id == 'stale' else 'is back online' }}
    message: >-
      {% if trigger.id == 'stale' %}Not seen since {{ as_timestamp(trigger.event.data.last_seen, 0) | timestamp_custom('%a %-I:%M %p') if trigger.event.data.last_seen else 'it was added' }}.{% else %}Answering again{% endif %}{% if trigger.event.data.ip %} ({{ trigger.event.data.ip }}){% endif %}
