name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Install the conversation packages Home Assistant pins (used by the AI tool tests)
        run: |
          # Read the manifest as a file: importing the conversation package needs these very requirements.
          pip install $(python -c "import json, pathlib, importlib.util; root = pathlib.Path(importlib.util.find_spec('homeassistant').origin).parent; print(' '.join(json.loads((root / 'components' / 'conversation' / 'manifest.json').read_text())['requirements']))")
      - run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/card.test.js

  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # current LTS for the browser tests; nothing in them needs it, the unit-test job above stays on 22
      - name: Install Playwright and the icon set the preview uses
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 @mdi/js@7.4.47
          cp node_modules/@mdi/js/mdi.js scripts/preview/mdi.js
      - name: Cache the browser
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}-${{ matrix.browser }}
      - name: Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Serve the repository
        run: |
          python3 -m http.server 8766 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8766/scripts/preview/index.html > /dev/null && break; sleep 1; done
      - name: Edit layout, zoom and touch in ${{ matrix.browser }}
        run: |
          set +e
          BROWSER=${{ matrix.browser }} node scripts/preview/interact.js > interact.log 2>&1
          code=$?
          cat interact.log
          if [ $code -ne 0 ]; then
            # Put the end of the log in an annotation, which stays readable when the raw log is not at hand.
            echo "::error title=interact.js failed::$(grep -v "^\s*[-0-9]* *[×-] \(waiting\|element\|scrolling\|done\|retrying\)" interact.log | tail -n 40 | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No real network addresses in code, tests or docs
        run: python3 scripts/check_examples.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
