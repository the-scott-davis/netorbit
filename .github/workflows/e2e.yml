name: E2E

# Runs NetOrbit inside the real Home Assistant container and opens the card in Chromium and WebKit.
# The logic lives in scripts/ci/ha_e2e.py so it can be run by hand too (see the top of that file).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-assistant:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A broken beta shows up as a warning on the run without blocking anything.
    continue-on-error: ${{ matrix.ha == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/ci/requirements_e2e.txt
      - run: pip install -r scripts/ci/requirements_e2e.txt

      - name: Pick the Home Assistant image
        id: image
        run: |
          # "pinned" is the release the unit tests run against (pytest-homeassistant-custom-component pins it).
          if [ "${{ matrix.ha }}" = pinned ]; then tag=$(python scripts/ci/ha_e2e.py pinned-version); else tag=beta; fi
          echo "Home Assistant image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start Home Assistant
        id: start
        run: |
          mkdir -p ha-config e2e-artifacts
          docker run -d --name ha-e2e -p 8123:8123 -e TZ=UTC \
            -v "$PWD/ha-config:/config" \
            -v "$PWD/custom_components/netorbit:/config/custom_components/netorbit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ steps.image.outputs.tag }}

      # Home Assistant boots while the browsers install.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/ci/requirements_e2e.txt') }}
      - name: Install Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium webkit
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium webkit

      - name: Onboard, add NetOrbit and check the card in Chromium and WebKit
        run: python scripts/ci/ha_e2e.py run --url http://localhost:8123 --out e2e-artifacts

      - name: Check the Home Assistant log
        if: always() && steps.start.outcome == 'success'
        run: |
          docker logs ha-e2e > e2e-artifacts/docker.log 2>&1 || true
          cp ha-config/home-assistant.log e2e-artifacts/ 2>/dev/null || true
          python scripts/ci/ha_e2e.py check-log e2e-artifacts/home-assistant.log e2e-artifacts/docker.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.ha }}
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
